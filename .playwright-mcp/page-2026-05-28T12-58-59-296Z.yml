          - generic [ref=e2711]: // weakness
          - heading "苦手な領域" [level=3] [ref=e2712]
          - generic [ref=e2714]: APIを使わない開発
          - paragraph [ref=e2715]: API連携だけに頼らず、コスト削減のためにあえて複雑な機能を自前で実装できると思えないため、そのようなことをできるようになりたいと考えています。例えば、Zoom-Video-SDKを使って実装できる機能を、コスト削減のために自前で実装するというのは難易度が高いと感じます。
          - img [ref=e2717]
